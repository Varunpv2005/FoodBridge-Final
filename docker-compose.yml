version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: foodbridge-backend
    ports:
      - "8000:8000"
    volumes:
      - foodbridge_db:/app/backend/db
      - foodbridge_uploads:/app/backend/uploads
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=sqlite:///./db/foodbridge.db
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - GOOGLE_MAPS_SERVER_API_KEY=${GOOGLE_MAPS_SERVER_API_KEY}
      - GOOGLE_MAPS_HTTP_REFERRER=${GOOGLE_MAPS_HTTP_REFERRER:-http://localhost:5173/}
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
    container_name: foodbridge-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  foodbridge_db:
  foodbridge_uploads:
